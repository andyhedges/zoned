name: "🌐 ZONED 🌐 : Continuous Integration"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MAVEN_OPTS: >-
    -Dmaven.wagon.http.retryHandler.class=standard
    -Dmaven.wagon.http.retryHandler.count=5
    -Dmaven.wagon.http.retryHandler.requestSentEnabled=true
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          maven-version: '3.9.12'
          cache: maven

      - name: Build & test with Maven
        run: |
          mvn \
            -B -ntp \
            -DtrimStackTrace=false \
            -Dstyle.color=never \
            clean verify

      - name: Upload JaCoCo aggregate coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco-aggregate/jacoco.xml,target/site/jacoco-aggregate-it/jacoco.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload shaded app jar
        uses: actions/upload-artifact@v6
        with:
          name: zoned-dns-app
          path: app/target/zoned-server.jar
          if-no-files-found: error
