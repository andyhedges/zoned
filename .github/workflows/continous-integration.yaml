name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & test with Maven
        run: |
          mvn \
            -B -ntp \
            -DtrimStackTrace=false \
            -Dstyle.color=never \
            clean verify

      - name: Upload shaded app jar
        uses: actions/upload-artifact@v4
        with:
          name: zoned-dns-app
          path: app/target/zoned-server.jar
          if-no-files-found: error
