server:

  do-daemonize: no

  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  access-control: 0.0.0.0/0 allow

  #gives us output to stout
  use-syslog: no
  logfile: ""
  verbosity: 2

  # Deterministic local zone for tests (records are injected via conf.d)
  local-zone: "example.test." static
include: "/etc/unbound/local-data.conf"

remote-control:
  control-enable: yes
  server-key-file: "/etc/unbound/unbound_server.key"
  server-cert-file: "/etc/unbound/unbound_server.pem"
  control-key-file: "/etc/unbound/unbound_control.key"
  control-cert-file: "/etc/unbound/unbound_control.pem"
