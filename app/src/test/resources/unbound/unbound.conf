server:

  do-daemonize: no

  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  access-control: 0.0.0.0/0 allow

  #gives us output to stout
  use-syslog: no
  logfile: ""
  verbosity: 2

  # Deterministic local zone for tests
  local-zone: "example.test." static
  local-data: "example.test. 60 A 192.0.2.123"
  local-data: "cname.example.test. 300 CNAME example.test."
  local-data: 'txt.example.test. 300 TXT "Hello, World!""Goodbye"'

remote-control:
  control-enable: yes
  server-key-file: "/etc/unbound/unbound_server.key"
  server-cert-file: "/etc/unbound/unbound_server.pem"
  control-key-file: "/etc/unbound/unbound_control.key"
  control-cert-file: "/etc/unbound/unbound_control.pem"
